<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pembayaran QRIS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --success: #10b981;
      --pending: #f59e0b;
      --failed: #ef4444;
      --slate-50: #f8fafc;
      --slate-100: #f1f5f9;
      --slate-200: #e2e8f0;
      --slate-300: #cbd5e1;
      --slate-500: #64748b;
      --slate-700: #334155;
      --slate-900: #0f172a;
    }

    body {
      background: #ffffff;
      color: var(--slate-900);
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    .payment-card {
      background: #ffffff;
      border: 1px solid var(--slate-100);
      border-radius: 24px;
      padding: 2.5rem 2.25rem;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.02), 0 20px 40px -10px rgba(0, 0, 0, 0.04);
      transition: all 0.3s ease;
    }

    .payment-card:hover {
      box-shadow: 0 15px 30px -5px rgba(0, 0, 0, 0.04), 0 25px 45px -10px rgba(0, 0, 0, 0.05);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 1.8rem;
    }

    .brand-icon {
      width: 44px;
      height: 44px;
      background: linear-gradient(135deg, #3b82f6, #1d4ed8);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      font-size: 1.25rem;
      box-shadow: 0 4px 10px rgba(37, 99, 235, 0.15);
    }

    .brand-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--slate-900);
    }

    .brand-sub {
      font-size: 0.75rem;
      color: var(--slate-500);
    }

    /* Amount box */
    .amount-box {
      background: var(--slate-50);
      border: 1px solid var(--slate-100);
      border-radius: 16px;
      padding: 1.25rem;
      margin-bottom: 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .amount-label {
      font-size: 0.78rem;
      color: var(--slate-500);
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .amount-value {
      font-size: 1.625rem;
      font-weight: 800;
      color: var(--slate-900);
    }

    .amount-badge {
      background: #fef3c7;
      color: #d97706;
      border-radius: 8px;
      padding: 4px 10px;
      font-size: 0.75rem;
      font-weight: 700;
    }

    /* QR Area */
    .qr-area {
      background: #ffffff;
      border: 1px dashed var(--slate-200);
      border-radius: 20px;
      padding: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 288px;
      position: relative;
      overflow: hidden;
      margin-bottom: 1.5rem;
    }

    .qr-area img {
      max-width: 240px;
      max-height: 240px;
      width: 100%;
      object-fit: contain;
      border-radius: 8px;
    }

    /* QR placeholder / loading */
    .qr-placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      color: var(--slate-500);
    }

    .qr-placeholder .spinner-border {
      width: 2.5rem;
      height: 2.5rem;
      border-width: 3px;
      color: var(--primary);
    }

    /* Overlay saat sukses */
    .qr-overlay {
      position: absolute;
      inset: 0;
      background: rgba(16, 185, 129, 0.98);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-radius: 20px;
      gap: 10px;
      opacity: 0;
      transform: scale(0.95);
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      pointer-events: none;
    }

    .qr-overlay.show {
      opacity: 1;
      transform: scale(1);
      pointer-events: auto;
    }

    .qr-overlay .check-icon {
      font-size: 3.75rem;
      color: #fff;
      animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .qr-overlay .success-text {
      font-size: 1.25rem;
      font-weight: 700;
      color: #fff;
    }

    @keyframes popIn {
      0% {
        transform: scale(0);
        opacity: 0;
      }

      70% {
        transform: scale(1.15);
      }

      100% {
        transform: scale(1);
        opacity: 1;
      }
    }

    /* Status badge */
    .status-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0.875rem 1.25rem;
      border-radius: 14px;
      margin-bottom: 1.2rem;
      font-size: 0.875rem;
      font-weight: 600;
      transition: all 0.3s ease;
    }

    .status-bar.pending {
      background: #fffbeb;
      border: 1px solid #fde68a;
      color: #d97706;
    }

    .status-bar.loading {
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      color: #2563eb;
    }

    .status-bar.success {
      background: #ecfdf5;
      border: 1px solid #a7f3d0;
      color: #059669;
    }

    .status-bar.failed {
      background: #fff1f2;
      border: 1px solid #fecdd3;
      color: #dc2626;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: currentColor;
      flex-shrink: 0;
    }

    .status-dot.pulse {
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% {
        box-shadow: 0 0 0 0 rgba(217, 119, 6, 0.4);
      }

      70% {
        box-shadow: 0 0 0 8px rgba(217, 119, 6, 0);
      }

      100% {
        box-shadow: 0 0 0 0 rgba(217, 119, 6, 0);
      }
    }

    /* Order info */
    .order-info {
      font-size: 0.8rem;
      color: var(--slate-500);
      margin-bottom: 1.5rem;
      text-align: center;
      background: var(--slate-50);
      padding: 6px 12px;
      border-radius: 8px;
      display: inline-block;
      margin-left: auto;
      margin-right: auto;
      width: fit-content;
    }

    .order-id {
      font-family: monospace;
      color: var(--primary);
      font-weight: 600;
      font-size: 0.85rem;
    }

    /* Buttons */
    .btn-qris {
      background: linear-gradient(135deg, #3b82f6, #1d4ed8);
      border: none;
      color: #fff;
      font-weight: 600;
      border-radius: 12px;
      padding: 0.875rem;
      width: 100%;
      font-size: 0.95rem;
      transition: all 0.2s ease;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.15);
    }

    .btn-qris:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(37, 99, 235, 0.25);
      background: linear-gradient(135deg, #2563eb, #1e40af);
    }

    .btn-qris:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .btn-refresh {
      background: transparent;
      border: 1px solid var(--slate-200);
      color: var(--slate-700);
      border-radius: 12px;
      padding: 0.875rem;
      width: 100%;
      font-size: 0.875rem;
      margin-top: 0.625rem;
      transition: all 0.2s ease;
      font-weight: 500;
    }

    .btn-refresh:hover {
      border-color: var(--primary);
      color: var(--primary);
      background: var(--slate-50);
    }

    /* WS connection indicator */
    .ws-indicator {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.72rem;
      color: var(--slate-500);
    }

    .ws-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--slate-200);
    }

    .ws-dot.connected {
      background: var(--success);
    }

    .ws-dot.connecting {
      background: var(--pending);
      animation: pulse 1s infinite;
    }

    /* e-wallet logos */
    .wallet-logos {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
    }

    .wallet-tag {
      background: var(--slate-50);
      border: 1px solid var(--slate-100);
      border-radius: 8px;
      padding: 4px 10px;
      font-size: 0.72rem;
      color: var(--slate-700);
      font-weight: 500;
    }

    /* Toast */
    .toast-container {
      z-index: 9999;
    }
  </style>
</head>

<body>

  <div class="payment-card">
    <!-- Brand header -->
    <div class="brand">
      <div class="brand-icon"><i class="bi bi-qr-code-scan"></i></div>
      <div>
        <div class="brand-title">Bayar QRIS</div>
      </div>
      <div class="ms-auto ws-indicator">
        <div class="ws-dot connecting" id="wsDot"></div>
        <span id="wsLabel">Connecting...</span>
      </div>
    </div>

    <!-- Amount -->
    <div class="amount-box">
      <div>
        <div class="amount-label">Total Pembayaran</div>
        <div class="amount-value">Rp 1</div>
      </div>
    </div>

    <!-- Status bar -->
    <div class="status-bar loading" id="statusBar">
      <div class="status-dot" id="statusDot"></div>
      <span id="statusText">Membuat QR Code...</span>
    </div>

    <!-- QR Area -->
    <div class="qr-area" id="qrArea">
      <div class="qr-placeholder" id="qrPlaceholder">
        <div class="spinner-border" role="status"></div>
        <small>Memuat QR Code...</small>
      </div>
      <img id="qrImage" src="" alt="QRIS Code" style="display:none" />
      <!-- Success overlay -->
      <div class="qr-overlay" id="qrOverlay">
        <div class="check-icon"><i class="bi bi-check-circle-fill"></i></div>
        <div class="success-text">Pembayaran Berhasil!</div>
        <div style="font-size:0.85rem;color:rgba(255,255,255,0.85);">Terima kasih 🎉</div>
      </div>
    </div>

    <!-- Order info -->
    <div class="order-info" id="orderInfo" style="display:none">
      Order ID: <span class="order-id" id="orderIdLabel">-</span>
    </div>

    <!-- Wallet list -->
    <div class="wallet-logos">
      <div class="wallet-tag">📱 GoPay</div>
      <div class="wallet-tag">💙 Dana</div>
      <div class="wallet-tag">🛍️ ShopeePay</div>
      <div class="wallet-tag">🏦 M-Banking</div>
      <div class="wallet-tag">+ lainnya</div>
    </div>

    <!-- Buttons -->
    <button class="btn-qris" id="btnCreate" onclick="createPayment()">
      <i class="bi bi-qr-code me-2"></i>Generate QR Baru
    </button>
    <button class="btn-refresh" id="btnRefresh" onclick="refreshStatus()" style="display:none">
      <i class="bi bi-arrow-clockwise me-1"></i>Cek Status Manual
    </button>
  </div>

  <!-- Toast notifikasi -->
  <div class="toast-container position-fixed bottom-0 end-0 p-3">
    <div id="toast" class="toast align-items-center text-white border-0" role="alert">
      <div class="d-flex">
        <div class="toast-body" id="toastMsg"></div>
        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    let currentOrderId = null;
    let ws = null;
    let wsConnected = false;
    let wsReconnectTimer = null;
    const WS_HOST = window.location.host;

    // ─── Init ───────────────────────────────────────────────
    window.addEventListener('DOMContentLoaded', () => {
      createPayment();
    });

    // ─── Create Payment ─────────────────────────────────────
    async function createPayment() {
      setStatus('loading', '⏳ Membuat transaksi QRIS...');
      showQRLoading();
      disableBtn(true);
      document.getElementById('btnRefresh').style.display = 'none';
      document.getElementById('orderInfo').style.display = 'none';

      // Tutup WS lama jika ada
      closeWS();

      try {
        const res = await fetch('/api/payment/create', { method: 'POST' });
        const json = await res.json();

        if (!json.success) throw new Error(json.message || 'Gagal membuat payment');

        const data = json.data;
        currentOrderId = data.order_id;

        // Tampilkan order ID
        document.getElementById('orderIdLabel').textContent = data.order_id;
        document.getElementById('orderInfo').style.display = 'block';

        // Tampilkan QR
        if (data.qr_image_url) {
          showQRImage(data.qr_image_url);
        } else if (data.qr_string) {
          // Generate QR dari string menggunakan API QR publik
          const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=240x240&data=${encodeURIComponent(data.qr_string)}`;
          showQRImage(qrUrl);
        } else {
          showQRError('QR tidak tersedia dari Midtrans');
        }

        setStatus('pending', '⏳ Menunggu pembayaran... Scan QR di atas');
        document.getElementById('btnRefresh').style.display = 'block';
        disableBtn(false);

        // Hubungkan WebSocket
        connectWS(data.order_id);

      } catch (err) {
        console.error(err);
        setStatus('failed', '❌ Error: ' + err.message);
        showQRError(err.message);
        disableBtn(false);
        showToast('Gagal: ' + err.message, 'danger');
      }
    }

    // ─── WebSocket ──────────────────────────────────────────
    function connectWS(orderID) {
      const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
      const url = `${protocol}//${WS_HOST}/ws/${orderID}`;

      console.log('[WS] Connecting:', url);
      setWSDot('connecting', 'Connecting...');

      ws = new WebSocket(url);

      ws.onopen = () => {
        wsConnected = true;
        setWSDot('connected', 'Live');
        console.log('[WS] Connected');
      };

      ws.onmessage = (e) => {
        try {
          const msg = JSON.parse(e.data);
          console.log('[WS] Message:', msg);
          handleWSMessage(msg);
        } catch (err) {
          console.error('[WS] Parse error:', err);
        }
      };

      ws.onclose = () => {
        wsConnected = false;
        setWSDot('disconnected', 'Offline');
        console.log('[WS] Closed');
        // Reconnect jika masih pending
        if (currentOrderId && document.getElementById('statusBar').classList.contains('pending')) {
          wsReconnectTimer = setTimeout(() => connectWS(orderID), 3000);
        }
      };

      ws.onerror = (e) => {
        console.error('[WS] Error:', e);
        setWSDot('disconnected', 'Error');
      };
    }

    function closeWS() {
      clearTimeout(wsReconnectTimer);
      if (ws) { ws.close(); ws = null; }
    }

    function handleWSMessage(msg) {
      if (msg.type === 'init') {
        console.log('[WS] Init status:', msg.status);
        if (msg.status === 'success') triggerSuccess();
      }

      if (msg.type === 'payment_update') {
        switch (msg.status) {
          case 'success':
            triggerSuccess();
            break;
          case 'failed':
            setStatus('failed', '❌ Pembayaran Gagal');
            showToast('Pembayaran gagal atau ditolak', 'danger');
            break;
          case 'expired':
            setStatus('failed', '⏰ QR Code Kedaluwarsa');
            showToast('QR Code sudah expired, buat QR baru', 'warning');
            break;
          default:
            setStatus('pending', '⏳ Status: ' + msg.status);
        }
      }
    }

    function triggerSuccess() {
      setStatus('success', '✅ Pembayaran Berhasil! Terima kasih 🎉');
      document.getElementById('qrOverlay').classList.add('show');
      document.getElementById('btnRefresh').style.display = 'none';
      document.getElementById('btnCreate').textContent = '🔄 Buat Pembayaran Baru';
      closeWS();
      showToast('🎉 Pembayaran berhasil diterima!', 'success');
    }

    // ─── Manual status check ─────────────────────────────────
    async function refreshStatus() {
      if (!currentOrderId) return;
      try {
        const res = await fetch(`/api/payment/${currentOrderId}`);
        const json = await res.json();
        if (json.success) {
          const status = json.data.status;
          showToast('Status: ' + status, status === 'success' ? 'success' : 'info');
          if (status === 'success') triggerSuccess();
        }
      } catch (e) {
        showToast('Gagal cek status', 'danger');
      }
    }

    // ─── UI helpers ─────────────────────────────────────────
    function setStatus(type, text) {
      const bar = document.getElementById('statusBar');
      const dot = document.getElementById('statusDot');
      const span = document.getElementById('statusText');
      bar.className = 'status-bar ' + type;
      dot.className = 'status-dot' + (type === 'pending' ? ' pulse' : '');
      span.textContent = text;
    }

    function showQRLoading() {
      document.getElementById('qrPlaceholder').style.display = 'flex';
      document.getElementById('qrImage').style.display = 'none';
      document.getElementById('qrOverlay').classList.remove('show');
    }

    function showQRImage(url) {
      const img = document.getElementById('qrImage');
      img.onload = () => {
        document.getElementById('qrPlaceholder').style.display = 'none';
        img.style.display = 'block';
      };
      img.onerror = () => showQRError('Gagal load gambar QR');
      img.src = url;
    }

    function showQRError(msg) {
      const ph = document.getElementById('qrPlaceholder');
      ph.innerHTML = `<i class="bi bi-exclamation-triangle" style="font-size:2rem;color:var(--failed)"></i><small style="color:var(--failed)">${msg}</small>`;
      ph.style.display = 'flex';
      document.getElementById('qrImage').style.display = 'none';
    }

    function disableBtn(v) {
      document.getElementById('btnCreate').disabled = v;
    }

    function setWSDot(state, label) {
      const dot = document.getElementById('wsDot');
      const lbl = document.getElementById('wsLabel');
      dot.className = 'ws-dot ' + (state === 'connected' ? 'connected' : state === 'connecting' ? 'connecting' : '');
      lbl.textContent = label;
    }

    function showToast(msg, type = 'info') {
      const toastEl = document.getElementById('toast');
      const colors = { success: '#10b981', danger: '#ef4444', warning: '#f59e0b', info: '#2563eb' };
      toastEl.style.background = colors[type] || colors.info;
      document.getElementById('toastMsg').textContent = msg;
      new bootstrap.Toast(toastEl, { delay: 4000 }).show();
    }
  </script>
</body>

</html>
